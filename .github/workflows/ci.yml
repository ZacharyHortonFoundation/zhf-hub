name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zhf-hub
    env:
      # build against PostgreSQL types, exactly like production
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-secret-not-used-at-runtime-0123456789
      APP_URL: https://example.org
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: zhf-hub/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
